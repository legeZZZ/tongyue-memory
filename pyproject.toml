[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mneme"
version = "0.1.0"
description = "Bitemporal textual memory service for Agent Memory Challenge Cycle 2 (academic, textual)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mneme contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.6",
  "numpy>=1.26",
  "jieba>=0.42.1",
]

[project.optional-dependencies]
qwen = ["torch>=2.2", "transformers>=4.51"]
dev = ["pytest>=8.0"]

[project.scripts]
mneme = "mneme.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "integration: live DashScope embedding call; skipped unless an embedding key is set",
  "real_llm: gpt-4o-mini plus text-embedding-v4 memory regressions; skipped unless both API keys are set",
]
filterwarnings = [
  "error",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:pkg_resources is deprecated",
]
